<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>만능다이어리</title>
<meta name="theme-color" content="#fff0f4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="만능다이어리">
<style>
:root{
  --bg:#fff0f4; --card:#ffffff; --ink:#3d2a33; --sub:#a0848f; --line:#f7d3de;
  --accent:#ff6b96; --accent-soft:#ffdbe6; --a:#ff7ea6; --b:#6fa3d8; --us:#f4a93c;
  --ok:#ff7ea6; --land:#fbe7ee; --land-line:#efc6d3; --shadow:0 3px 0 #f9d9e3;
  --seoul:#c2185b; --home:#ff3d7f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;max-width:560px;margin:0 auto}
header h1{font-size:20px;color:var(--accent);letter-spacing:-.5px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:transparent;font-size:20px;padding:6px;border-radius:10px}
.sync{font-size:12px;color:var(--sub);white-space:nowrap}
.sync.err{color:var(--accent)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.card h2 .more{margin-left:auto;font-size:12px;color:var(--sub);background:none;border:0;padding:0}
.dday{font-size:34px;font-weight:800;letter-spacing:-1px}
.dday small{font-size:14px;color:var(--sub);font-weight:500;margin-left:6px;letter-spacing:0}
.names{font-size:15px;margin-top:4px}
.names .a{color:var(--a);font-weight:700}.names .b{color:var(--b);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--sub);font-size:13px}
.btn{border:1.5px solid var(--accent);background:var(--accent);color:#fff;border-radius:12px;padding:10px 14px;font-weight:600}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.warn{background:var(--card);color:var(--accent);border-color:var(--accent-soft)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:max(16px,calc(50vw - 264px));bottom:calc(84px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.18);z-index:6}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:7}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:20px;filter:grayscale(1);opacity:.6}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs button.on span{filter:none;opacity:1}
/* 캘린더 */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-head b{flex:1;text-align:center;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .dow{text-align:center;font-size:11px;color:var(--sub);padding:4px 0}
.cal .dow:first-child,.cal .d.sun .n{color:#d9534f}.cal .dow:last-child,.cal .d.sat .n{color:#4a7cc4}
.cal .d{min-height:62px;border-radius:10px;padding:3px;background:transparent;border:0;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;position:relative}
.cal .d.out{opacity:.3}
.cal .d .n{font-size:12px;font-weight:600;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cal .d.heart .n{background:var(--accent-soft)}
.cal .d.today .n{background:var(--accent);color:#fff!important}
.cal .d .ph{width:100%;aspect-ratio:1;border-radius:6px;background-size:cover;background-position:center}
.cal .d .ev{font-size:10px;line-height:1.25;border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.a{background:#fbe3e9}.ev.b{background:#e0ecf8}.ev.us{background:#faefd4}
.mini .d{min-height:0;aspect-ratio:1;align-items:center;justify-content:center;padding:0}
.mini .d .n{font-size:11px}
.who-legend{display:flex;gap:10px;font-size:12px;color:var(--sub);margin-top:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.list .item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.list .item .th{width:54px;height:54px;border-radius:10px;background:var(--land) center/cover;flex:none}
.list .item .tx{flex:1;min-width:0}
.list .item .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{color:var(--us);letter-spacing:1px;font-size:13px}
/* 지도 */
.map-box{position:relative}
.map-box svg{width:100%;height:auto;display:block;touch-action:manipulation}
.map-box path.rg{fill:var(--land);stroke:var(--land-line);stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer}
.map-box path.rg.v{fill:var(--accent-soft)}
.map-box path.edge{fill:none;stroke:#fff;stroke-width:1.2;vector-effect:non-scaling-stroke;pointer-events:none}
.map-box text{font-size:9px;fill:#7a5a66;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:2.5px;stroke-linejoin:round}
.stat{font-size:13px;color:var(--sub)}.stat b{color:var(--ink);font-size:16px}
/* 앨범 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid .p{aspect-ratio:1;border-radius:8px;background:var(--land) center/cover;border:0;padding:0}
.grid .p.wait{background-image:linear-gradient(90deg,var(--land),#f6efe6,var(--land));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.month{font-weight:700;margin:16px 2px 8px}
/* 기록 */
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--card);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;padding:0}
.check.on{background:var(--ok);border-color:var(--ok)}
.done-t{text-decoration:line-through;color:var(--sub)}
/* 시트(아래에서 올라오는 창) */
.dim{position:fixed;inset:0;background:rgba(30,20,15,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:17px}
.field{margin:10px 0}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.field textarea{min-height:70px;resize:vertical}
.btns{display:flex;gap:8px;margin-top:14px}
.btns .btn{flex:1}
.rate button{border:0;background:none;font-size:26px;padding:0 2px;color:var(--line)}
.rate button.on{color:var(--us)}
.pick-ph{width:100%;height:150px;border:1.5px dashed var(--line);border-radius:12px;background:var(--bg) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.viewer{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vb{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));justify-content:space-between;color:#fff;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90vw}
.empty{text-align:center;color:var(--sub);padding:24px 0;font-size:14px}
.hidden{display:none!important}
/* 홈 2열 블록 */
.hg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.hg .card{margin:0;padding:12px;min-width:0}
.hg .wide{grid-column:span 2}
.hg .card h2{font-size:13px;margin-bottom:8px}
.dd-tile{position:relative;overflow:hidden;background:linear-gradient(160deg,#ff9bb8,#ff6b96);color:#fff;border-color:transparent;display:flex;flex-direction:column;justify-content:flex-end;min-height:170px;background-size:cover;background-position:center}
.dd-tile.ph::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(60,10,30,.6))}
.dd-tile>*{position:relative}
.dd-tile .lb{font-size:12px;opacity:.95}
.dd-tile .big{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.dd-tile .nm{font-size:12px;margin-top:4px;opacity:.95}
.hg .mini .d .n{font-size:10px;width:18px;height:18px}
.hg .mini .dow{font-size:9px;padding:1px 0}
.hg .grid{grid-template-columns:repeat(4,1fr)}
.map-mini svg{width:100%;height:auto;display:block}
.map-mini text{display:none}
.map-box .home text,.map-mini .home text{display:block;font-weight:700;fill:var(--home);font-size:13px}
.map-box path.sb{fill:none;stroke:var(--seoul);stroke-width:2.6;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
.map-box path.ib{fill:none;stroke:#8e5cc9;stroke-width:2;stroke-dasharray:5 3;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
.an-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.an-row:first-of-type{border-top:0}
.an-row b{color:var(--accent)}
.banner{background:#fff;border:1.5px dashed var(--accent);border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
</style>
</head>
<body>
<header>
  <h1 id="appTitle">만능다이어리</h1>
  <span class="sync" id="sync"></span>
  <button class="icon-btn" id="btnSettings" aria-label="설정">⚙️</button>
</header>
<div class="wrap" id="view"></div>
<button class="fab hidden" id="fab" aria-label="추가">＋</button>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<input type="file" id="fileIn" accept="image/*" class="hidden">
<input type="file" id="fileMulti" accept="image/*" multiple class="hidden">

<script>
(function () {
  "use strict";
  // ================= 설정 =================
  var API_URL = "https://script.google.com/macros/s/AKfycbwfNnq510CpZdon6NjYqvJKuYpZzbh2_XB76C7tkg5hC1bGoDFtiU4acBReBljsAsJI/exec"; // 구글 Apps Script 배포 주소 (배포 후 채움)
  var THUMB_MAX = 480, THUMB_Q = 0.8, FULL_MAX = 1600, FULL_Q = 0.85;

  // ================= 작은 도구 =================
  function $(s, el) { return (el || document).querySelector(s); }
  function $$(s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseYmd(s) { var p = String(s || "").split("-"); return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]) : null; }
  function today() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function toast(msg, ms) {
    var t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, ms || 2200);
  }
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];

  // ================= 기기 저장소 (IndexedDB) =================
  var idb = null;
  function idbOpen() {
    return new Promise(function (res) {
      setTimeout(res, 3000); // 3초 안에 안 열리면 보관함 없이 진행
      try {
        var rq = indexedDB.open("uri-girok", 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore("kv"); };
        rq.onsuccess = function () { idb = rq.result; res(); };
        rq.onerror = function () { res(); };
      } catch (e) { res(); }
    });
  }
  function kvGet(k) {
    return new Promise(function (res) {
      if (!idb) return res(undefined);
      try { var rq = idb.transaction("kv").objectStore("kv").get(k); rq.onsuccess = function () { res(rq.result); }; rq.onerror = function () { res(undefined); }; }
      catch (e) { res(undefined); }
    });
  }
  function kvSet(k, v) {
    return new Promise(function (res) {
      if (!idb) return res();
      try { var tx = idb.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = res; tx.onerror = res; }
      catch (e) { res(); }
    });
  }
  function kvDel(k) {
    return new Promise(function (res) {
      if (!idb) return res();
      try { var tx = idb.transaction("kv", "readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete = res; tx.onerror = res; }
      catch (e) { res(); }
    });
  }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // ================= 데이터 =================
  // db.rec[종류][id] = {data, updated, by} / db.photos[id] = {id, taken, by, created}
  var db = { rec: {}, photos: {} };
  var thumbs = {}; // id -> dataURL (화면에 띄운 작은 사진)
  function recs(c) { var m = db.rec[c] || {}; return Object.keys(m).map(function (id) { return Object.assign({ id: id }, m[id].data || {}); }); }
  function rec(c, id) { var m = db.rec[c] || {}; return m[id] ? Object.assign({ id: id }, m[id].data) : null; }
  function settings() {
    return Object.assign({ title: "만능다이어리", nameA: "나", nameB: "너", start: "", homeA: "", homeB: "" }, (rec("settings", "main") || {}));
  }
  function myName() { return ""; } // 둘이 같이 쓰므로 기기별 사용자 구분은 하지 않음
  function saveLocal() { return kvSet("db", db); }

  function putRec(c, id, data) {
    db.rec[c] = db.rec[c] || {};
    db.rec[c][id] = { data: data, updated: "", by: myName() };
    saveLocal();
    queue({ a: "put", c: c, id: id, data: data, by: myName() });
  }
  function delRec(c, id) {
    if (db.rec[c]) delete db.rec[c][id];
    saveLocal();
    queue({ a: "del", c: c, id: id, by: myName() });
  }

  // ================= 클라우드 (전용 링크 #k=비밀키) =================
  var cloud = { key: lsGet("ug_key", ""), outbox: [], sent: [], busy: false, state: "" };
  (function readKey() {
    var m = location.hash.match(/k=([^&]+)/);
    if (m) {
      cloud.key = decodeURIComponent(m[1]); lsSet("ug_key", cloud.key);
      try { window.history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    }
  })();
  function cloudOn() { return !!(API_URL && cloud.key); }
  function setSync(text, err) { var el = $("#sync"); el.textContent = text; el.classList.toggle("err", !!err); }
  function api(body) {
    body.k = cloud.key;
    return fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (!d || !d.ok) throw new Error((d && d.error) || "error"); return d; });
  }
  function queue(op) {
    cloud.outbox.push(op);
    kvSet("outbox", cloud.outbox);
    flush();
  }
  function showPending() {
    if (!cloudOn()) { setSync("📱 이 기기에만 저장"); return; }
    var n = cloud.outbox.length;
    setSync(n ? "⏳ 보내는 중 " + n : "☁️ 저장됨");
  }
  function flush() {
    showPending();
    if (!cloudOn() || cloud.busy || !cloud.outbox.length) return;
    cloud.busy = true;
    var op = cloud.outbox[0];
    var p;
    if (op.a === "upPhoto") {
      p = Promise.all([kvGet("t:" + op.id), kvGet("f:" + op.id)]).then(function (x) {
        var mem = pendingPh[op.id] || {};
        x[0] = x[0] || mem.t; x[1] = x[1] || mem.f;
        if (!x[0] || !x[1]) return { skipped: true };
        return api({ a: "upPhoto", id: op.id, taken: op.taken, by: op.by, thumb: x[0].split(",")[1], full: x[1].split(",")[1] })
          .then(function (d) { delete pendingPh[op.id]; return kvDel("f:" + op.id).then(function () { return d; }); });
      });
    } else {
      p = api(op);
    }
    p.then(function () {
      cloud.sent.push({ op: op, at: Date.now() });
      if (cloud.sent.length > 300) cloud.sent.shift();
      cloud.outbox.shift(); kvSet("outbox", cloud.outbox);
      cloud.busy = false; flush();
    }, function (err) {
      cloud.busy = false;
      if (err.message === "unauthorized") setSync("⚠️ 링크가 맞지 않아요", true);
      else { setSync("⚠️ 연결 안 됨 · 이 기기에 보관 중", true); setTimeout(flush, 15000); }
    });
  }
  function pull() {
    if (!cloudOn()) return Promise.resolve();
    setSync("⏳ 불러오는 중");
    var startedAt = Date.now() - 1000;
    return api({ a: "load" }).then(function (d) {
      var nr = {};
      d.records.forEach(function (r) { (nr[r.c] = nr[r.c] || {})[r.id] = { data: r.data, updated: r.updated, by: r.by }; });
      var np = {};
      d.photos.forEach(function (p) { np[p.id] = p; });
      // 아직 서버에 못 보낸 변경 + 불러오는 동안 보낸 변경은 내 것으로 덮어 둔다
      var mine = cloud.sent.filter(function (x) { return x.at >= startedAt; }).map(function (x) { return x.op; }).concat(cloud.outbox);
      mine.forEach(function (op) {
        if (op.a === "put") (nr[op.c] = nr[op.c] || {})[op.id] = { data: op.data, updated: "", by: op.by };
        if (op.a === "del" && nr[op.c]) delete nr[op.c][op.id];
        if (op.a === "upPhoto") np[op.id] = { id: op.id, taken: op.taken, by: op.by, created: "" };
        if (op.a === "delPhoto") delete np[op.id];
      });
      db.rec = nr; db.photos = np; saveLocal();
      showPending(); render();
    }, function (err) {
      setSync(err.message === "unauthorized" ? "⚠️ 링크가 맞지 않아요" : "⚠️ 연결 안 됨 · 이 기기 기록 표시 중", true);
    });
  }

  // ================= 사진 =================
  function loadImg(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () { res({ im: im, url: url }); };
      im.onerror = function () { URL.revokeObjectURL(url); rej(new Error("이미지를 열 수 없어요")); };
      im.src = url;
    });
  }
  function shrink(im, max, q) {
    var w = im.naturalWidth, h = im.naturalHeight, s = Math.min(1, max / Math.max(w, h));

  // 작은 사진 불러오기: 기기 보관함 → 없으면 서버에서 여러 장씩
  var thumbWant = {}, thumbTimer = null, thumbStats = [];
  function thumbUrl(id) {
    if (!id) return "";

    return "";

  function fetchThumbs() {
    var ids = Object.keys(thumbWant); thumbWant = {};
    Promise.all(ids.map(function (id) { return kvGet("t:" + id).then(function (v) { return [id, v]; }); })).then(function (rs) {
      var miss = [];
      rs.forEach(function (r) { if (r[1]) thumbs[r[0]] = r[1]; else miss.push(r[0]); });
      paintThumbs();
      if (!cloudOn() || !miss.length) return;
      var chunks = [];
      for (var i = 0; i < miss.length; i += 30) chunks.push(miss.slice(i, i + 30));
      chunks.reduce(function (p, ch) {
        return p.then(function () {
          var t0 = performance.now();
          return api({ a: "thumbs", ids: ch }).then(function (d) {
            thumbStats.push({ n: Object.keys(d.thumbs).length, ms: Math.round(performance.now() - t0) });
            Object.keys(d.thumbs).forEach(function (id) {
              var u = "data:image/jpeg;base64," + d.thumbs[id]; thumbs[id] = u; kvSet("t:" + id, u);

        var ord = { "서울": 0, "인천": 1, "경기": 2 };
        var fs = geo.features.slice().sort(function (a, b) { return (ord[a.properties.prov] - ord[b.properties.prov]) || a.properties.name.localeCompare(b.properties.name, "ko"); });
        var opts = '<option value="">선택 안 함</option>' + fs.map(function (f) { return '<option value="cap:' + f.properties.code + '">' + f.properties.prov + " " + esc(f.properties.name) + "</option>"; }).join("");
        ["homeA", "homeB"].forEach(function (n) { var sel = $("[name=" + n + "]", el); sel.innerHTML = opts; sel.value = s[n] || ""; });
        geoOk = true;
      }).catch(function () {});
      $("[data-save]", el).onclick = function () {
        putRec("settings", "main", Object.assign({}, (db.rec.settings && db.rec.settings.main && db.rec.settings.main.data) || {}, { title: $("[name=title]", el).value.trim() || "만능다이어리", nameA: $("[name=nameA]", el).value.trim() || "나", nameB: $("[name=nameB]", el).value.trim() || "너", start: $("[name=start]", el).value,
          homeA: geoOk ? $("[name=homeA]", el).value : s.homeA, homeB: geoOk ? $("[name=homeB]", el).value : s.homeB }));
        close(); render();
      };
      $("[data-speed]", el).onclick = function () { speedTest($("#speedOut", el)); };
      $("[data-fake]", el).onclick = function () { fakePhotos(20, $("#speedOut", el)); };
      $("[data-unfake]", el).onclick = function () {
        var ids = Object.keys(db.photos).filter(function (id) { return db.photos[id].by === "시험"; });
        ids.forEach(function (id) { delete db.photos[id]; delete thumbs[id]; kvDel("t:" + id); kvDel("f:" + id); queue({ a: "delPhoto", id: id }); });
        saveLocal(); $("#speedOut", el).textContent = "시험 사진 " + ids.length + "장 지움"; render();
      };
    });
  }
  // 속도 재기: 목록 불러오기 + 작은 사진 30장 받기 시간을 잰다 (기기 보관함은 쓰지 않음)
  function speedTest(out) {
    if (!cloudOn()) { out.textContent = "서버 연결 후에 잴 수 있어요"; return; }
    var lines = [], t0 = performance.now();
    function log(s) { lines.push(s); out.textContent = lines.join("\n"); }
    log("재는 중…");
    api({ a: "ping" }).then(function (d) {
      log("① 연결 확인: " + Math.round(performance.now() - t0) + "ms (서버 안 " + d.ms + "ms)");
      var t1 = performance.now();
      return api({ a: "load" }).then(function (d2) {
        log("② 목록 불러오기: " + Math.round(performance.now() - t1) + "ms · 기록 " + d2.records.length + "개, 사진 " + d2.photos.length + "장 (서버 안 " + d2.ms + "ms)");
        var ids = d2.photos.slice(0, 30).map(function (p) { return p.id; });
        if (!ids.length) return log("③ 사진이 없어서 사진 속도는 못 쟀어요");
        var t2 = performance.now();
        return api({ a: "thumbs", ids: ids }).then(function (d3) {
          var n = Object.keys(d3.thumbs).length, kb = Math.round(Object.keys(d3.thumbs).reduce(function (s, k) { return s + d3.thumbs[k].length; }, 0) * 0.75 / 1024);
          log("③ 작은 사진 " + n + "장: " + Math.round(performance.now() - t2) + "ms · " + kb + "KB (서버 안 " + d3.ms + "ms)");
          if (ids[0]) { var t3 = performance.now(); return api({ a: "full", id: ids[0] }).then(function (d4) { log("④ 큰 사진 1장: " + Math.round(performance.now() - t3) + "ms · " + Math.round((d4.full || "").length * 0.75 / 1024) + "KB (서버 안 " + d4.ms + "ms)"); }); }
        });
      });
    }).then(function () { log("측정 끝 " + new Date().toLocaleString()); }, function (e) { log("오류: " + e.message); });
  }
  // 시험용 사진 만들기 (실제 사진 크기와 비슷하게 노이즈를 넣음)
  function fakePhotos(n, out) {
    var made = 0;
    function one() {
      var c = document.createElement("canvas"); c.width = 1600; c.height = 1200; var g = c.getContext("2d");
      var hue = Math.floor(Math.random() * 360), gr = g.createLinearGradient(0, 0, 1600, 1200);
      gr.addColorStop(0, "hsl(" + hue + ",60%,70%)"); gr.addColorStop(1, "hsl(" + ((hue + 80) % 360) + ",60%,45%)");
      g.fillStyle = gr; g.fillRect(0, 0, 1600, 1200);
      var im = g.getImageData(0, 0, 1600, 1200), dd = im.data;
      for (var i = 0; i < dd.length; i += 4) { var r = (Math.random() - 0.5) * 50; dd[i] += r; dd[i + 1] += r; dd[i + 2] += r; }
      g.putImageData(im, 0, 0);
      g.fillStyle = "#fff"; g.font = "bold 160px sans-serif"; g.fillText("시험 " + (made + 1), 120, 650);
      var full = c.toDataURL("image/jpeg", FULL_Q);
      var c2 = document.createElement("canvas"); c2.width = 480; c2.height = 360; c2.getContext("2d").drawImage(c, 0, 0, 480, 360);
      var d = new Date(); d.setDate(d.getDate() - Math.floor(Math.random() * 120));
      return addPhotoData(uid(), c2.toDataURL("image/jpeg", THUMB_Q), full, ymd(d), "시험");
    }
    (function loop() {
      if (made >= n) { out.textContent = "시험 사진 " + n + "장 만들었어요. 다 올라간 뒤(위쪽 ☁️ 저장됨) 속도 재기를 눌러 주세요."; render(); return; }
      out.textContent = "만드는 중 " + made + "/" + n;
      one().then(function () { made++; setTimeout(loop, 0); });
    })();
  }

  // ================= 시작 =================
  $("#btnSettings").onclick = openSettings;
  var ready = idbOpen().then(function () { return Promise.all([kvGet("db"), kvGet("outbox")]); }).then(function (x) {
    // 보관함을 읽는 사이에 생긴 변경이 있으면 지우지 않고 뒤에 붙인다
    var early = cloud.outbox;
    if (x[0] && x[0].rec) {
      early.forEach(function (op) {
        if (op.a === "put") (x[0].rec[op.c] = x[0].rec[op.c] || {})[op.id] = { data: op.data, updated: "", by: op.by };
        if (op.a === "upPhoto" && db.photos[op.id]) x[0].photos[op.id] = db.photos[op.id];
      });
      db = x[0];
    }
    cloud.outbox = (Array.isArray(x[1]) ? x[1] : []).concat(early);
    render(); showPending();
    // 전용 링크로 열었으면 서버에서 설정을 먼저 받아온 뒤, 그래도 없을 때만 설정 창을 연다
    if (!cloudOn()) { if (!settings().start) setTimeout(openSettings, 300); return flush(); }
    return pull().then(function () { if (!settings().start && !document.querySelector(".dim")) openSettings(); }).then(flush);
  });
  window.addEventListener("online", flush);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") pull(); });
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
  window.__ug = { ready: ready, db: function () { return db; }, cloud: cloud, setApi: function (u) { API_URL = u; }, pull: pull, flush: flush, render: render, putRec: putRec, addPhotoData: addPhotoData };
})();
</script>
</body>
