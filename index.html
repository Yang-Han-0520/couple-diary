<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>만능다이어리</title>
<meta name="theme-color" content="#faf7f5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="만능다이어리">
<style>
:root{
  --bg:#faf7f5; --card:#ffffff; --ink:#2f2a29; --sub:#9b918e; --line:#efe9e6; --soft:#f5f0ee;
  --accent:#e57c93; --accent-soft:#fbe6eb; --a:#ee93a9; --b:#8fb2dd; --us:#e9b45c;
  --a-bg:#fcebf0; --b-bg:#e9f1fa; --us-bg:#fbf1de;
  --ok:#e57c93; --land:#eee8e1; --land-v:#f7d6df;
  --seoul:#c94f6d; --home:#e0466c;
  --shadow:0 1px 2px rgba(60,40,40,.04),0 6px 18px rgba(60,40,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;letter-spacing:-.2px}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:6px;padding:calc(12px + env(safe-area-inset-top)) 18px 8px;max-width:560px;margin:0 auto}
header h1{font-size:19px;font-weight:800;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.5px;display:flex;align-items:center;gap:6px}
header h1 svg{flex:none;width:16px;height:16px}
.icon-btn{border:0;background:transparent;padding:6px;border-radius:10px;display:flex;color:#6f6664}
.sync{font-size:11px;color:var(--sub);white-space:nowrap}
.sync.err{color:var(--accent)}
.card{background:var(--card);border:0;border-radius:20px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.card h2{font-size:14px;margin:0 0 12px;color:var(--ink);font-weight:700;display:flex;align-items:center;gap:6px}
.card h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.card h2 .more{margin-left:auto;font-size:12px;color:var(--sub);background:none;border:0;padding:0;font-weight:500}
.card h2 .badge{margin-left:auto}
.badge{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--soft);color:#7d7371;white-space:nowrap}
.badge.soft{background:var(--soft)}
.dday{font-size:30px;font-weight:800;letter-spacing:-1px}
.big-n{font-size:24px;font-weight:800;letter-spacing:-.5px}
.big-n small,.tile-ph .dn small{font-size:.5em;font-weight:700;margin-left:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:1px 0 4px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--soft);border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap;font-weight:600;color:#7d7371}
.chip.on{background:var(--ink);color:#fff}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--sub);font-size:13px}
.btn{border:0;background:var(--accent);color:#fff;border-radius:14px;padding:12px 14px;font-weight:700}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.warn{background:#fff;color:#d6455f;border:1px solid #f2d0d7}
.btn.small{padding:8px 12px;font-size:13px;border-radius:12px}
.btn.block{width:100%;display:block}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:max(18px,calc(50vw - 262px));bottom:calc(88px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:28px;line-height:1;box-shadow:0 6px 16px rgba(229,124,147,.35);z-index:6}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:7}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11px;color:#b9b0ad;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
nav.tabs button.on{color:var(--accent);font-weight:700}
/* 홈 2열 */
.hg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.hg .card{margin:0;padding:13px;min-width:0}
.hg .wide{grid-column:span 2}
.hg .card h2{font-size:13px;margin-bottom:9px}
.card.tile-ph{padding:14px;overflow:hidden;position:relative;aspect-ratio:1;background:linear-gradient(160deg,#f3b5c3,#e57c93) center/cover;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;align-items:flex-start}
.card.tile-ph.ph::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.5))}
.card.tile-ph>*{position:relative}
.tile-ph .wd{font-size:12px;font-weight:600;opacity:.95}
.tile-ph .dn{font-size:40px;font-weight:800;line-height:1.05;letter-spacing:-1.5px}
.tile-ph .nm{font-size:12px;font-weight:600;opacity:.95;margin-top:2px}
.card.tile-ph.plain{background:#fff;color:var(--ink)}
.tile-ph.plain .dn{color:var(--accent)}
.tile-ph.plain .wd,.tile-ph.plain .nm{color:var(--sub);opacity:1}
.tile-ph .deco{position:absolute;top:14px;right:14px;opacity:.9}
.tile-ph .pick{position:absolute;top:12px;left:14px;font-size:11px;color:var(--sub);font-weight:600}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.grid4 .p,.grid2 .p{aspect-ratio:1;border-radius:10px;background:var(--land) center/cover;border:0;padding:0;display:block;width:100%}
.an-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.an-row:first-of-type{border-top:0}
.an-row b{color:var(--accent);font-weight:700}
.bk-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;min-width:0}
.bk-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-tile{position:relative;aspect-ratio:1;border-radius:14px;background:var(--land) center/cover;overflow:hidden;border:0;padding:0;display:block;width:100%}
/* 캘린더 */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-head b{flex:1;font-size:18px;font-weight:800}
.nav-btn{width:32px;height:32px;border-radius:50%;border:0;background:var(--soft);font-size:16px;padding:0;color:#6f6664}
.who-pills{display:flex;gap:6px;margin-bottom:12px}
.who-pills button{border:0;border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;background:var(--soft);color:var(--ink);display:flex;align-items:center;gap:6px}
.who-pills button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dc)}
.who-pills button.off{opacity:.4}
.wp-a{--dc:var(--a)}.wp-b{--dc:var(--b)}.wp-us{--dc:var(--us)}
.switch{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sub);cursor:pointer}
.switch i{width:38px;height:22px;border-radius:99px;background:#e2dbd8;position:relative;transition:.2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on i{background:var(--accent)}
.switch.on i::after{left:19px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 1px}
.cal .dow{text-align:center;font-size:11px;color:var(--sub);padding:4px 0;font-weight:600}
.cal .dow:first-child,.cal .d.sun .n{color:#d9576b}.cal .dow:last-child,.cal .d.sat .n{color:#5a86c9}
.cal .d{min-height:74px;border-radius:8px;padding:2px 1px;background:transparent;border:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;overflow:hidden;position:relative}
.cal .d.out{opacity:.3}
.cal .d .n{font-size:12px;font-weight:600;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.cal .d.heart .n{background:var(--accent-soft)}
.cal .d.today .n{background:var(--accent);color:#fff!important}
.cal .d .ph{width:92%;aspect-ratio:1;border-radius:6px;background-size:cover;background-position:center;flex:none}
.cal .d .ev{width:100%;font-size:10px;line-height:1.3;border-radius:4px;padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev.a{background:var(--a-bg)}.ev.b{background:var(--b-bg)}.ev.us{background:var(--us-bg)}.ev.auto{background:var(--soft);color:#7d7371}
.mini .d{min-height:0;aspect-ratio:1;align-items:center;justify-content:center;padding:0}
.mini .d .n{font-size:10.5px;width:19px;height:19px}
.mini .dow{font-size:10px;padding:1px 0}
.who-legend{display:flex;gap:10px;font-size:12px;color:var(--sub);margin-top:10px;line-height:1.5}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.day-sec{font-size:13px;font-weight:700;margin:16px 0 6px;color:#6f6664}
/* 목록 */
.list .item{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.list .item .th{width:52px;height:52px;border-radius:12px;background:var(--land) center/cover;flex:none}
.list .item .tx{flex:1;min-width:0}
.list .item .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.stars{color:#e8a93a;letter-spacing:1px;font-size:12px}
.food-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.food-card{border:0;background:none;padding:0;text-align:left;width:100%}
.food-card .ph-tile{box-shadow:var(--shadow)}
.food-card .kind{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);color:var(--ink);font-size:11px;padding:3px 8px;border-radius:99px;font-weight:600}
.food-card .ft{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:14px;font-weight:700}
.food-card .ft span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food-card .ft .sc{color:#7d7371;font-weight:600;font-size:12px}
.food-card .ft .sc::before{content:"★ ";color:#e8a93a}
.media-row{display:flex;gap:12px;align-items:center;border:0;border-top:1px solid var(--line);background:none;padding:11px 0;width:100%;text-align:left}
.media-row:first-child{border-top:0}
.media-row .th{width:52px;height:52px;border-radius:12px;background:var(--land) center/cover;flex:none}
.media-row .tx{flex:1;min-width:0}
.media-row .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:600}
.note-head{display:flex;align-items:center;gap:8px;margin:16px 2px 10px}
.note-head h2{margin:0;font-size:19px;font-weight:800;flex:1}
/* 지도 */
.map-box{position:relative}
.map-box svg{width:100%;height:auto;display:block;touch-action:manipulation}
.map-box path.rg{fill:var(--land);stroke:#fff;stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:pointer}
.map-box path.rg.v{fill:var(--land-v)}
.map-box path.edge{fill:none;stroke:#fff;stroke-width:1.4;vector-effect:non-scaling-stroke;pointer-events:none}
.map-box text{font-size:9px;fill:#968b84;font-weight:600;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:2.5px;stroke-linejoin:round}
.stat{font-size:13px;color:var(--sub)}.stat b{color:var(--ink);font-size:15px}
.map-mini svg{width:100%;height:auto;display:block}
.map-mini text{display:none}
.map-box .home text,.map-mini .home text{display:block;font-weight:800;fill:var(--home)}
.map-box path.sb{fill:none;stroke:var(--seoul);stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
.map-box path.ib{fill:none;stroke:#9a7cc4;stroke-width:1.8;stroke-dasharray:5 3;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
/* 앨범 */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.grid .p{aspect-ratio:1;border-radius:6px;background:var(--land) center/cover;border:0;padding:0}
.grid .p.wait{background-image:linear-gradient(90deg,var(--land),#f6f1ec,var(--land));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.month{font-weight:800;font-size:17px;margin:22px 2px 6px}
.album-grp{margin:0 0 14px}
.album-grp .gh{padding:4px 2px 7px;font-size:13px}
.album-grp .gh .memo{color:var(--sub);margin-top:2px;white-space:pre-wrap}
/* 기록 */
.bar{height:7px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid #d8cfcc;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;padding:0}
.check.sm{width:17px;height:17px}
.check.on{background:var(--accent);border-color:var(--accent)}
.done-t{text-decoration:line-through;color:var(--sub)}
/* 시트 */
.dim{position:fixed;inset:0;background:rgba(40,30,30,.38);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:9px;background:#e8e1de;margin:0 auto 14px}
.sheet h3{margin:0 0 12px;font-size:18px;font-weight:800}
.field{margin:10px 0}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fcfbfa;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:#fff}
.field textarea{min-height:76px;resize:vertical}
.btns{display:flex;gap:10px;margin-top:16px}
.btns .btn{flex:1}
.rate button{border:0;background:none;font-size:28px;padding:0 2px;color:#e8e1de}
.rate button.on{color:#e8a93a}
.pick-ph{width:100%;height:150px;border:1.5px dashed #ddd3d0;border-radius:14px;background:#fcfbfa center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--sub);font-weight:600}
.viewer{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vb{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));justify-content:space-between;color:#fff;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90vw}
.empty{text-align:center;color:var(--sub);padding:22px 0;font-size:14px}
.hidden{display:none!important}
.banner{background:#fff;border-radius:16px;padding:11px 13px;font-size:13px;margin:8px 0;box-shadow:var(--shadow)}
</style>
</head>

<header>
  <h1><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#e57c93" d="M12 21.3l-1.4-1.3C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5z"/></svg><span id="appTitle">만능다이어리</span></h1>
  <span class="sync" id="sync"></span>

</header>
<div class="wrap" id="view"></div>
<button class="fab hidden" id="fab" aria-label="추가">＋</button>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<input type="file" id="fileIn" accept="image/*" class="hidden">
<input type="file" id="fileMulti" accept="image/*" multiple class="hidden">

<script>
(function () {
  "use strict";
  // ================= 설정 =================
  var API_URL = "https://script.google.com/macros/s/AKfycbwfNnq510CpZdon6NjYqvJKuYpZzbh2_XB76C7tkg5hC1bGoDFtiU4acBReBljsAsJI/exec"; // 구글 Apps Script 배포 주소 (배포 후 채움)
  var THUMB_MAX = 480, THUMB_Q = 0.8, FULL_MAX = 1600, FULL_Q = 0.85;

  // ================= 작은 도구 =================
  function $(s, el) { return (el || document).querySelector(s); }
  function $$(s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseYmd(s) { var p = String(s || "").split("-"); return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]) : null; }
  function today() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function toast(msg, ms) {
    var t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, ms || 2200);
  }
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];

  // ================= 기기 저장소 (IndexedDB) =================
  var idb = null;
  function idbOpen() {
    return new Promise(function (res) {
      setTimeout(res, 3000); // 3초 안에 안 열리면 보관함 없이 진행
      try {
        var rq = indexedDB.open("uri-girok", 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore("kv"); };
        rq.onsuccess = function () { idb = rq.result; res(); };
        rq.onerror = function () { res(); };
      } catch (e) { res(); }
    });
  }
  function kvGet(k) {
    return new Promise(function (res) {
      if (!idb) return res(undefined);
      try { var rq = idb.transaction("kv").objectStore("kv").get(k); rq.onsuccess = function () { res(rq.result); }; rq.onerror = function () { res(undefined); }; }
      catch (e) { res(undefined); }
    });

      h += '<div class="chips scroll" style="margin-bottom:12px"><button class="chip' + (!noteKind ? " on" : "") + '" data-kf="">전체</button>' + conf.kinds.map(function (k) { return '<button class="chip' + (noteKind === k ? " on" : "") + '" data-kf="' + k + '">' + k + "</button>"; }).join("") + "</div>";
      if (!items.length) h += '<div class="card"><div class="empty">아직 기록이 없어요<br>오른쪽 아래 ＋ 로 추가해요</div></div>';
      else if (noteTab === "food") {
        h += '<div class="food-grid">' + items.map(function (x) {
          return '<button class="food-card" data-en="' + x.id + '"><div class="ph-tile"' + (x.photo ? ' data-ph="' + esc(x.photo) + '"' + phStyle(x.photo) : "") + '><span class="kind">' + esc(x.kind || "") + '</span></div><div class="ft"><span>' + esc(x.title) + "</span>" + (+x.rating ? '<span class="sc">' + (+x.rating).toFixed(1) + "</span>" : "") + "</div>" +
            (x.place ? '<div class="muted" style="font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📍 ' + esc(x.place) + "</div>" : "") + "</button>";
        }).join("") + "</div>";
      } else {
        h += items.map(function (x) {
          var d = parseYmd(x.date);
          return '<button class="media-row" data-en="' + x.id + '"><div class="th"' + (x.photo ? ' data-ph="' + esc(x.photo) + '"' + phStyle(x.photo) : "") + '></div><div class="tx"><b>' + esc(x.title) + '</b><div class="muted" style="font-size:12px">' + esc(x.kind || "") + (d ? " · " + d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일" : "") + '</div><span class="stars">' + stars(x.rating) + "</span></div></button>";
        }).join("");
      }
    }
    v.innerHTML = h;
    $$("[data-nt]", v).forEach(function (b) { b.onclick = function () { noteTab = b.getAttribute("data-nt"); noteKind = ""; lsSet("ug_note", noteTab); render(); }; });
    $$("[data-kf]", v).forEach(function (b) { b.onclick = function () { noteKind = b.getAttribute("data-kf"); render(); }; });
    $$("[data-en]", v).forEach(function (b) { b.onclick = function () { editNote(noteTab, rec(noteTab, b.getAttribute("data-en"))); }; });
    $$("[data-tg]", v).forEach(function (b) {
      b.onclick = function () { var x = rec("bucket", b.getAttribute("data-tg")); x.done = !x.done; x.doneDate = x.done ? ymd(today()) : ""; var id = x.id; delete x.id; putRec("bucket", id, x); if (x.done) toast("🎉 달성!"); render(); };
    });
    $$("[data-eb]", v).forEach(function (b) { b.onclick = function () { editBucket(rec("bucket", b.getAttribute("data-eb"))); }; });
    fab.classList.remove("hidden");
    fab.onclick = function () { if (noteTab === "bucket") editBucket(null); else editNote(noteTab, null); };
  }
  function editNote(c, x) {
    var isNew = !x, conf = NOTE[c]; x = x || { title: "", kind: conf.kinds[0], rating: 0, date: ymd(today()), memo: "", photo: "", place: "" };
    var h = "<h3>" + conf.label + " " + (isNew ? "추가" : "고치기") + "</h3>" +
      '<div class="field"><button type="button" class="pick-ph"></button></div>' +
      '<div class="field"><label>' + (c === "food" ? "가게 이름" : "제목") + '</label><input name="title" maxlength="60" value="' + esc(x.title) + '"></div>' +
      '<div class="field"><label>종류</label><div class="chips" data-kinds>' + conf.kinds.map(function (k) { return '<button type="button" class="chip' + (x.kind === k ? " on" : "") + '" data-k="' + k + '">' + k + "</button>"; }).join("") + "</div></div>" +
      '<div class="field"><label>별점</label>' + rateHtml(+x.rating || 0) + "</div>" +
      (c === "food" ? '<div class="field"><label>위치 (선택)</label><input name="place" maxlength="80" placeholder="예: 성수동" value="' + esc(x.place || "") + '"></div>' : "") +
      '<div class="field"><label>날짜</label><input type="date" name="date" value="' + esc(x.date) + '"></div>' +
      '<div class="field"><label>한 줄 메모</label><textarea name="memo" maxlength="500">' + esc(x.memo) + "</textarea></div>" +
      '<div class="btns">' + (isNew ? "" : '<button class="btn warn" data-del>지우기</button>') + '<button class="btn" data-save>저장</button></div>';
    sheet(h, function (el, close) {
      var kind = x.kind, ph = bindPhotoPick(el, x.photo); bindRate(el);
      $$("[data-k]", el).forEach(function (b) { b.onclick = function () { kind = b.getAttribute("data-k"); $$("[data-k]", el).forEach(function (q) { q.classList.toggle("on", q === b); }); }; });
      $("[data-save]", el).onclick = function () {
        var title = $("[name=title]", el).value.trim(); if (!title) return toast("이름을 적어 주세요");
        var pl = $("[name=place]", el);
        putRec(c, x.id || uid(), { title: title, kind: kind, rating: +$(".rate", el).getAttribute("data-rate"), date: $("[name=date]", el).value, memo: $("[name=memo]", el).value.trim(), photo: ph.id, place: pl ? pl.value.trim() : "" });
        close(); render();
      };
      var del = $("[data-del]", el); if (del) del.onclick = function () { if (confirm("지울까요?")) { delRec(c, x.id); close(); render(); } };
    });
  }
  function editBucket(x) {
    var isNew = !x; x = x || { title: "", done: false, doneDate: "", created: "" };
    var h = "<h3>🪣 " + (isNew ? "버킷리스트 추가" : "고치기") + '</h3><div class="field"><input name="title" maxlength="60" placeholder="예: 번지점프 하기" value="' + esc(x.title) + '"></div>' +
      '<div class="btns">' + (isNew ? "" : '<button class="btn warn" data-del>지우기</button>') + '<button class="btn" data-save>저장</button></div>';
    sheet(h, function (el, close) {
      var inp = $("[name=title]", el); setTimeout(function () { inp.focus(); }, 50);
      $("[data-save]", el).onclick = function () {
        var t = inp.value.trim(); if (!t) return;
        putRec("bucket", x.id || uid(), { title: t, done: !!x.done, doneDate: x.doneDate || "", created: x.created || new Date().toISOString() });
        close(); render();
      };
      var del = $("[data-del]", el); if (del) del.onclick = function () { if (confirm("지울까요?")) { delRec("bucket", x.id); close(); render(); } };
    });
  }

  // ---------- 설정 ----------
  function openSettings() {
    var s = settings();
    var h = "<h3>⚙️ 설정</h3>" +
      '<div class="field"><label>앱 이름</label><input name="title" maxlength="20" value="' + esc(s.title) + '"></div>' +
      '<div class="row"><div class="field" style="flex:1"><label>첫 번째 사람</label><input name="nameA" maxlength="10" value="' + esc(s.nameA) + '"></div><div class="field" style="flex:1"><label>두 번째 사람</label><input name="nameB" maxlength="10" value="' + esc(s.nameB) + '"></div></div>' +
      '<div class="field"><label>만난 날 (1일째)</label><input type="date" name="start" value="' + esc(s.start) + '"></div>' +
      '<div class="row"><div class="field" style="flex:1;min-width:0"><label>' + esc(s.nameA) + ' 사는 곳</label><select name="homeA"><option value="">불러오는 중…</option></select></div><div class="field" style="flex:1;min-width:0"><label>' + esc(s.nameB) + ' 사는 곳</label><select name="homeB"><option value="">불러오는 중…</option></select></div></div>' +
      '<div class="btns"><button class="btn" data-save>저장</button></div>' +
      '<hr style="border:0;border-top:1px solid var(--line);margin:18px 0">' +
      '<div class="muted">저장 상태: ' + (cloudOn() ? "둘이 같이 보는 중 (서버 연결됨)" : API_URL ? "전용 링크로 열지 않음 → 이 기기에만 저장" : "서버 연결 전 → 이 기기에만 저장") + " · 못 보낸 변경 " + cloud.outbox.length + "개</div>" +
      '<div class="btns"><button class="btn ghost small" data-speed>⏱ 속도 재기</button><button class="btn ghost small" data-fake>🧪 시험 사진 20장</button><button class="btn ghost small" data-unfake>시험 사진 지우기</button></div>' +
      '<pre class="muted" id="speedOut" style="white-space:pre-wrap;font-size:12px"></pre>';
    sheet(h, function (el, close) {
      var geoOk = false;
      loadGeo("geo/capital.json").then(function (geo) {
        var ord = { "서울": 0, "인천": 1, "경기": 2 };
        var fs = geo.features.slice().sort(function (a, b) { return (ord[a.properties.prov] - ord[b.properties.prov]) || a.properties.name.localeCompare(b.properties.name, "ko"); });
        var opts = '<option value="">선택 안 함</option>' + fs.map(function (f) { return '<option value="cap:' + f.properties.code + '">' + f.properties.prov + " " + esc(f.properties.name) + "</option>"; }).join("");
        ["homeA", "homeB"].forEach(function (n) { var sel = $("[name=" + n + "]", el); sel.innerHTML = opts; sel.value = s[n] || ""; });
        geoOk = true;
      }).catch(function () {});
      $("[data-save]", el).onclick = function () {
        putRec("settings", "main", Object.assign({}, (db.rec.settings && db.rec.settings.main && db.rec.settings.main.data) || {}, { title: $("[name=title]", el).value.trim() || "만능다이어리", nameA: $("[name=nameA]", el).value.trim() || "나", nameB: $("[name=nameB]", el).value.trim() || "너", start: $("[name=start]", el).value,
          homeA: geoOk ? $("[name=homeA]", el).value : s.homeA, homeB: geoOk ? $("[name=homeB]", el).value : s.homeB }));
        close(); render();
      };
      $("[data-speed]", el).onclick = function () { speedTest($("#speedOut", el)); };
      $("[data-fake]", el).onclick = function () { fakePhotos(20, $("#speedOut", el)); };
      $("[data-unfake]", el).onclick = function () {
        var ids = Object.keys(db.photos).filter(function (id) { return db.photos[id].by === "시험"; });
        ids.forEach(function (id) { delete db.photos[id]; delete thumbs[id]; kvDel("t:" + id); kvDel("f:" + id); queue({ a: "delPhoto", id: id }); });
        saveLocal(); $("#speedOut", el).textContent = "시험 사진 " + ids.length + "장 지움"; render();
      };
    });
  }
  // 속도 재기: 목록 불러오기 + 작은 사진 30장 받기 시간을 잰다 (기기 보관함은 쓰지 않음)
  function speedTest(out) {
    if (!cloudOn()) { out.textContent = "서버 연결 후에 잴 수 있어요"; return; }
    var lines = [], t0 = performance.now();
    function log(s) { lines.push(s); out.textContent = lines.join("\n"); }
    log("재는 중…");
    api({ a: "ping" }).then(function (d) {
      log("① 연결 확인: " + Math.round(performance.now() - t0) + "ms (서버 안 " + d.ms + "ms)");
      var t1 = performance.now();
      return api({ a: "load" }).then(function (d2) {
        log("② 목록 불러오기: " + Math.round(performance.now() - t1) + "ms · 기록 " + d2.records.length + "개, 사진 " + d2.photos.length + "장 (서버 안 " + d2.ms + "ms)");
        var ids = d2.photos.slice(0, 30).map(function (p) { return p.id; });
        if (!ids.length) return log("③ 사진이 없어서 사진 속도는 못 쟀어요");
        var t2 = performance.now();
        return api({ a: "thumbs", ids: ids }).then(function (d3) {
          var n = Object.keys(d3.thumbs).length, kb = Math.round(Object.keys(d3.thumbs).reduce(function (s, k) { return s + d3.thumbs[k].length; }, 0) * 0.75 / 1024);
          log("③ 작은 사진 " + n + "장: " + Math.round(performance.now() - t2) + "ms · " + kb + "KB (서버 안 " + d3.ms + "ms)");
          if (ids[0]) { var t3 = performance.now(); return api({ a: "full", id: ids[0] }).then(function (d4) { log("④ 큰 사진 1장: " + Math.round(performance.now() - t3) + "ms · " + Math.round((d4.full || "").length * 0.75 / 1024) + "KB (서버 안 " + d4.ms + "ms)"); }); }
        });
      });
    }).then(function () { log("측정 끝 " + new Date().toLocaleString()); }, function (e) { log("오류: " + e.message); });
  }
  // 시험용 사진 만들기 (실제 사진 크기와 비슷하게 노이즈를 넣음)
  function fakePhotos(n, out) {
    var made = 0;
    function one() {
      var c = document.createElement("canvas"); c.width = 1600; c.height = 1200; var g = c.getContext("2d");
      var hue = Math.floor(Math.random() * 360), gr = g.createLinearGradient(0, 0, 1600, 1200);
      gr.addColorStop(0, "hsl(" + hue + ",60%,70%)"); gr.addColorStop(1, "hsl(" + ((hue + 80) % 360) + ",60%,45%)");
      g.fillStyle = gr; g.fillRect(0, 0, 1600, 1200);
      var im = g.getImageData(0, 0, 1600, 1200), dd = im.data;
      for (var i = 0; i < dd.length; i += 4) { var r = (Math.random() - 0.5) * 50; dd[i] += r; dd[i + 1] += r; dd[i + 2] += r; }
      g.putImageData(im, 0, 0);
      g.fillStyle = "#fff"; g.font = "bold 160px sans-serif"; g.fillText("시험 " + (made + 1), 120, 650);
      var full = c.toDataURL("image/jpeg", FULL_Q);
      var c2 = document.createElement("canvas"); c2.width = 480; c2.height = 360; c2.getContext("2d").drawImage(c, 0, 0, 480, 360);
      var d = new Date(); d.setDate(d.getDate() - Math.floor(Math.random() * 120));
      return addPhotoData(uid(), c2.toDataURL("image/jpeg", THUMB_Q), full, ymd(d), "시험");
    }
    (function loop() {
      if (made >= n) { out.textContent = "시험 사진 " + n + "장 만들었어요. 다 올라간 뒤(위쪽 ☁️ 저장됨) 속도 재기를 눌러 주세요."; render(); return; }
      out.textContent = "만드는 중 " + made + "/" + n;
      one().then(function () { made++; setTimeout(loop, 0); });
    })();
  }

  // ================= 시작 =================
  $("#btnSettings").onclick = openSettings;
  var ready = idbOpen().then(function () { return Promise.all([kvGet("db"), kvGet("outbox")]); }).then(function (x) {
    // 보관함을 읽는 사이에 생긴 변경이 있으면 지우지 않고 뒤에 붙인다
    var early = cloud.outbox;
    if (x[0] && x[0].rec) {
      early.forEach(function (op) {
        if (op.a === "put") (x[0].rec[op.c] = x[0].rec[op.c] || {})[op.id] = { data: op.data, updated: "", by: op.by };
        if (op.a === "upPhoto" && db.photos[op.id]) x[0].photos[op.id] = db.photos[op.id];
      });
      db = x[0];
    }
    cloud.outbox = (Array.isArray(x[1]) ? x[1] : []).concat(early);
    render(); showPending();
    // 전용 링크로 열었으면 서버에서 설정을 먼저 받아온 뒤, 그래도 없을 때만 설정 창을 연다
    if (!cloudOn()) { if (!settings().start) setTimeout(openSettings, 300); return flush(); }
    return pull().then(function () { if (!settings().start && !document.querySelector(".dim")) openSettings(); }).then(flush);
  });
  window.addEventListener("online", flush);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") pull(); });
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
  window.__ug = { ready: ready, db: function () { return db; }, cloud: cloud, setApi: function (u) { API_URL = u; }, pull: pull, flush: flush, render: render, putRec: putRec, addPhotoData: addPhotoData };
})();
</script>
</body>
</html>
